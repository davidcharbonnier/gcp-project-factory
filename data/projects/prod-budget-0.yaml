parent: budget/prod
shared_vpc_service_config:
  host_project: prod-spoke-0
  network_users:
    - gcp-devops
services:
- sqladmin.googleapis.com
- compute.googleapis.com
- run.googleapis.com
- cloudscheduler.googleapis.com
org_policies:
  run.allowedIngress:
    rules:
    - allow:
        all: true
  iam.allowedPolicyMemberDomains:
    rules:
    - allow:
        all: true
